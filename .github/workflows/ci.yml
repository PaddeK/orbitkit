name: CI

on:
    push:
        branches: [main]
        tags: ["v*"]
    pull_request:

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: oven-sh/setup-bun@v2
            - run: bun install --frozen-lockfile
            # The same pinned release as in the Dockerfile, so the epublift tests run too
            - name: Install epublift
              run: |
                  curl -sfL -o /tmp/epublift.tar.gz https://github.com/ePubLift/epublift/releases/download/cli-v4.5.1/epublift-4.5.1-x86_64-unknown-linux-musl.tar.gz
                  echo "ec147844eb9f2ce923f71ebb983605d252a536927a9d3637d893bd6435e17801  /tmp/epublift.tar.gz" | sha256sum -c -
                  tar -xzf /tmp/epublift.tar.gz -C /tmp
                  sudo install -m 755 /tmp/epublift-*/epublift /usr/local/bin/epublift
            - run: bun run typecheck
            - run: bun test

    # Multi-arch image on ghcr.io: "latest" follows main, version tags (v1.2.3) also publish 1.2.3, 1.2 and 1
    image:
        needs: test
        if: github.event_name == 'push'
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        steps:
            - uses: actions/checkout@v7
            - uses: docker/setup-buildx-action@v4
            - uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            - id: meta
              uses: docker/metadata-action@v6
              with:
                  images: ghcr.io/${{ github.repository }}
                  tags: |
                      type=raw,value=latest,enable={{is_default_branch}}
                      type=semver,pattern={{version}}
                      type=semver,pattern={{major}}.{{minor}}
                      type=semver,pattern={{major}}
                      type=sha
            # The Dockerfile cross-compiles, so arm64 builds without emulation
            - uses: docker/build-push-action@v7
              with:
                  context: .
                  platforms: linux/amd64,linux/arm64
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
